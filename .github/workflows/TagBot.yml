name: TagBot

on:
  issue_comment:
    types:
      - created
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: read

jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@cded32665b34ca0496d3ac10a67d08ddfc726963 # v1.25.11
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Requires a repository secret named SSH_KEY whose public key is added
          # as a write-enabled deploy key. Without it, TagBot may need manual
          # intervention for tags that trigger other workflows or touch workflow
          # files.
          ssh: ${{ secrets.SSH_KEY }}
