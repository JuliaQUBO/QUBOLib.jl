name: Documentation
run-name: "${{ inputs.dependabot_pr && format('Dependabot documentation PR #{0}', inputs.dependabot_pr) || github.event.pull_request.title || github.event.head_commit.message || 'Documentation' }}"
on:
  push:
    branches: [main]
    tags: '*'
  pull_request:
    types: [opened, synchronize, reopened]

  workflow_dispatch:
    inputs:
      dependabot_pr:
        description: Merged Dependabot PR whose publication is being refreshed
        type: string
        required: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: documentation-publishing
  cancel-in-progress: false
  queue: max

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Develop QUBOLib.jl
        run: julia --project=docs -e 'using Pkg; Pkg.develop(path=pwd())'
      - name: Build Package
        uses: julia-actions/julia-buildpkg@v1
        with: 
            project: "docs"
      - name: Build documentation
        run: julia --project=docs docs/make.jl --skip-deploy

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - name: Setup Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Develop QUBOLib.jl
        run: julia --project=docs -e 'using Pkg; Pkg.develop(path=pwd())'
      - name: Build Package
        uses: julia-actions/julia-buildpkg@v1
        with:
            project: "docs"
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # For authentication with GitHub Actions token
        run: julia --project=docs docs/make.jl
